<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus life planner</title>
    <link rel="stylesheet" href=""styles/main.css">
    <link rel="icon" href="assets/favicon.svg">
</head>
<body>
    < a href="#main-content" class="skip-link">skip to main content</a>
    
    <header>
        <h1>Campus Life Planner</h1>
        <nav>
            <a href="#dashboard">Dashboard</a>
            <a href="#records">Records</a>
            <a href="tests.html">Tests</a>
        </nav>
    </header>

    <main id="main-content">
        <div id="aria-live-status" class="sr-only" aria-live="polite"></div>

        <section id="dashboard">
            <h2>Dashboard Stats</h2>
            <p>Total Tasks: <span id="stat-count">0</span></p>
            <p>Total duration: <span id="stat-duration">0 hrs</span></p>
            <div>
                <button id="export-btn">Export JSON</button>
                <label for="import-file" style="display:inline-block; cursor:pointed; background:#2563eb; color:#fff; padding:0.4rem 0.8; border-radius:4px; font-size:0.9rem;">Import JSON</label>
                <input type="file" id="import-file" accept=".json" style="display:none;">
            </div>
        </section>

        <section>
            <h2>Add New Record</h2>
            <form id="record-form">
                <div>
                    <label for="title">Title</label>
                    <input type="text" id="title" required>
                </div>
                <div>
                    <label for="duration">Duration (hours)</label>
                    <input type="text" id="date" required>
                </div>
                <div>
                    <label for="tag">Tag</label>
                    <input type="text" id="tag" required>
                </div>
                <button type="submit" style="grid-column: span 2;">Save Record</button>
            </form>
        </section>

        <section id="records">
            <h2>Records List</h2>
            <input type="text" id="search-input" placeholder="search tasks or tags (Regex supported)..."style="width:100%; padding:0.5rem; margin-bottom:1rem; box-sizing:border-box;">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Duration</th>
                        <th>Date</th>
                        <th>Tag</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="records-tbody"></tbody> 
            </table>
         </section>
        </main>

        <footer>
            <p style="text-align:center; padding:1rem; color:#64748b;">Campus Life planner &copy; 2026</p>
        </footer>

        <script type="module" src="scripts/main.js"></script>
        </body>
        </html>
