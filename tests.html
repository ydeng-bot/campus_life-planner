<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Life Planner - Tests</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main class="tests">
        <h1>Automated test suite</h1>
        <p id="summary" role="status"></p>
        <ul id="test-list"></ul>
        <p><a href="index.html">Back to the app</a></p>
    </main>

    <script type="module">
        import { runTests } from './tests/cases.js';

        const list = document.getElementById('test-list');
        const results = runTests();

        results.forEach(test => {
            const li = document.createElement('li');
            const name = document.createElement('span');
            const status = document.createElement('span');
            name.textContent = test.name;
            status.textContent = test.passed ? 'PASS' : 'FAIL';
            status.className = test.passed ? 'pass' : 'fail';
            li.append(name, status);
            list.appendChild(li);
        });

        const passed = results.filter(t => t.passed).length;
        document.getElementById('summary').textContent = `${passed} of ${results.length} tests passed.`;
    </script>
</body>
</html>
